<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timeline Grid — 사진 타임라인 콜라주</title>
<meta name="description" content="사진을 올리고 시간과 문구만 적으면 타임라인 콜라주를 만들어 줍니다. 사진은 브라우저 밖으로 나가지 않습니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tinos:ital,wght@0,400;0,700;1,400&display=swap">
<style>
  :root {
    --ink: #14140f;
    --muted: #6f6f66;
    --line: #e3e2dc;
    --bg: #faf9f5;
    --accent: #14140f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Segoe UI", sans-serif;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 48px 24px 96px; }
  h1 { font: 400 40px/1.1 "Tinos", "Times New Roman", serif; margin: 0 0 8px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 36px; max-width: 56ch; }
  .sub a { color: var(--muted); }

  section { margin-bottom: 36px; }
  h2 { font: 400 13px/1 -apple-system, sans-serif; letter-spacing: .14em; text-transform: uppercase;
       color: var(--muted); margin: 0 0 14px; }

  #drop {
    border: 1px dashed var(--line); border-radius: 4px; background: #fff;
    padding: 44px 24px; text-align: center; cursor: pointer; transition: border-color .15s, background .15s;
  }
  #drop:hover, #drop.over { border-color: var(--ink); background: #fff; }
  #drop strong { display: block; font: 400 20px/1.3 "Tinos", serif; margin-bottom: 4px; }
  #drop span { color: var(--muted); font-size: 14px; }
  #file { display: none; }

  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
  .bar .grow { flex: 1; }
  .bar select { max-width: 100%; }
  button, select {
    font: inherit; font-size: 14px; padding: 7px 14px; border: 1px solid var(--line);
    background: #fff; color: var(--ink); border-radius: 3px; cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--ink); }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .count { color: var(--muted); font-size: 14px; }

  #list { display: grid; gap: 10px; }
  .card {
    display: grid; grid-template-columns: 78px 1fr auto; gap: 14px; align-items: center;
    background: #fff; border: 1px solid var(--line); border-radius: 4px; padding: 10px;
  }
  .card img { width: 78px; height: 52px; object-fit: cover; border-radius: 2px; display: block; background: #eee; }
  .fields { display: grid; grid-template-columns: minmax(180px, 210px) 1fr; gap: 8px; }
  .fields input {
    font: inherit; font-size: 14px; padding: 6px 9px; border: 1px solid var(--line);
    border-radius: 3px; background: #fff; color: var(--ink); width: 100%; min-width: 0;
  }
  .fields input:focus { outline: none; border-color: var(--ink); }
  .ops { display: flex; gap: 4px; }
  .ops button { padding: 5px 9px; line-height: 1; }
  .idx { position: absolute; }

  #pages { display: grid; gap: 28px; }
  .page { background: #fff; border: 1px solid var(--line); border-radius: 4px; padding: 14px; }
  .page canvas { width: 100%; height: auto; display: block; touch-action: none; cursor: grab; }
  .page canvas:active { cursor: grabbing; }
  .page .row { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
  .page .row span { color: var(--muted); font-size: 13px; flex: 1; }

  /* Square outline icon buttons, the shape shadcn's `variant="outline" size="icon"` gives.
     The brand marks are inline SVG because they have to be: shadcn draws its icons from lucide,
     and lucide carries no brand logos, so its own blocks paste the marks in by hand too. */
  .share { display: flex; gap: 6px; }
  .icon-btn {
    width: 32px; height: 32px; padding: 0; display: inline-flex; align-items: center;
    justify-content: center; color: var(--muted);
    transition: color .15s, border-color .15s, background .15s;
  }
  .icon-btn:hover:not(:disabled) { color: var(--ink); border-color: var(--ink); background: var(--bg); }
  .icon-btn svg { width: 16px; height: 16px; fill: currentColor; display: block; }
  .hint, .status { color: var(--muted); font-size: 13px; }
  .hint { margin: -6px 0 14px; }
  .status { margin: 10px 0 0; min-height: 0; }

  .empty { color: var(--muted); font-size: 14px; padding: 8px 0; }
  @media (max-width: 640px) {
    .wrap { padding: 32px 16px 72px; }
    h1 { font-size: 32px; }
    .card { grid-template-columns: 62px 1fr; }
    .card img { width: 62px; height: 44px; }
    .fields { grid-template-columns: 1fr; }
    .ops { grid-column: 1 / -1; justify-content: flex-end; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Timeline Grid</h1>
  <p class="sub">
    사진을 여러 장 올리고 사진마다 시각과 문구를 적으면, 하루의 흐름을 담은 타임라인 콜라주를 만들어 줍니다.
    1열(3컷), 2열(6컷), 4열(8컷) 중에서 선택할 수 있고, 넘치면 자동으로 다음 장으로 넘어갑니다.
    모든 처리는 브라우저 안에서 끝나며 사진은 어디로도 전송되지 않습니다.
  </p>

  <section>
    <div id="drop">
      <input type="file" id="file" accept="image/*" multiple>
      <strong>사진 고르기</strong>
      <span>여기로 끌어다 놓거나 눌러서 선택하세요</span>
    </div>
    <p class="hint" id="dropNote" aria-live="polite" hidden></p>
  </section>

  <section>
    <div class="bar">
      <h2 style="margin:0 8px 0 0">사진</h2>
      <span class="count" id="count">0장</span>
      <span class="grow"></span>
      <select id="cols" title="열 수">
        <option value="2">2열</option>
        <option value="1">1열</option>
        <option value="4">4열</option>
      </select>
      <select id="font" title="캡션 폰트"></select>
      <select id="locale" title="캡션 날짜 표기">
        <option value="en-US">English — 04:56, Thursday, July 09</option>
        <option value="ko-KR">한국어 — 04:56, 목요일, 7월 09일</option>
      </select>
      <button id="sort">시간순 정렬</button>
      <button id="clear">전체 지우기</button>
    </div>
    <div id="list"></div>
    <p class="empty" id="listEmpty">아직 사진이 없습니다.</p>
  </section>

  <section>
    <div class="bar">
      <h2 style="margin:0 8px 0 0">미리보기</h2>
      <span class="grow"></span>
      <button id="dlAll" class="primary" disabled>전체 내려받기</button>
    </div>
    <p class="hint" id="shareHint" hidden></p>
    <div id="pages"></div>
    <p class="empty" id="pagesEmpty">사진을 올리면 결과가 여기에 나타납니다.</p>
  </section>
</div>

<script type="module">
import {
  SPEC, FONTS, perPage, paginate, formatStamp, renderPage, previewWidth, exifDateTime,
  cellRect, layoutFor, SHARE_W, SERVICES, sharePlan, intentUrl, shareText, skippedNote,
} from './timeline.js';

const EXPORT_W = SPEC.ref; // downloads come out at 3077px, same as the source

const $ = (id) => document.getElementById(id);
const items = [];
let seq = 0;
let pending = 0; // photos picked but not read yet — what the count reports on while a batch runs

/* ---------- reading files ---------- */

// createImageBitmap can honour EXIF orientation, which keeps portrait phone shots upright.
async function decode(file) {
  try {
    return await createImageBitmap(file, { imageOrientation: 'from-image' });
  } catch {
    // The object URL has to outlive this call — the image is drawn later, and revoking
    // here would blank it. The browser reclaims it when the tab closes.
    const img = new Image();
    img.src = URL.createObjectURL(file);
    await img.decode();
    return img;
  }
}

// EXIF sits in the segments ahead of the pixel data, so only the head of the file is read — a
// dozen multi-megabyte photos have no business being in memory to answer one question. 128KB
// clears the APP1 segment even when the camera parked a full thumbnail in it.
async function captureTime(file) {
  try {
    return exifDateTime(await file.slice(0, 128 * 1024).arrayBuffer()) ?? new Date(file.lastModified);
  } catch {
    return new Date(file.lastModified); // unreadable head — the mtime is still a usable guess
  }
}

// The card's <img> is 78x52. Pointing it at the original file made the browser decode all 12MP
// a second time to paint that box — 1,705ms of decode for twelve photos, and the object URL
// pinned the file's bytes for as long as the card lived. The decoded bitmap is already here, so
// scale it down once instead. 156px is twice the box, which is what a DPR 2 screen asks for;
// the card's object-fit does the cropping.
const THUMB_W = 156;
function thumbUrl(img) {
  const w = img.naturalWidth || img.width;
  const h = img.naturalHeight || img.height;
  const c = document.createElement('canvas');
  c.width = THUMB_W;
  c.height = Math.max(1, Math.round((THUMB_W * h) / w));
  // willReadFrequently keeps this canvas on the CPU, which is what toDataURL wants to read back:
  // twelve photos cost 10ms this way against 275ms on the default GPU-backed canvas. The default
  // smoothing is left alone for the same reason — asking for 'high' costs 133ms instead of 10ms
  // and moves 1% of a channel on a 78px thumbnail.
  const cx = c.getContext('2d', { willReadFrequently: true });
  cx.drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.7);
}

async function addFiles(fileList) {
  // Everything picked is tried, rather than only what the OS tagged image/*. A file that is not
  // an image fails the decode below and gets named in the note — which is the point: a pick that
  // was thrown away used to say nothing at all, and file.type is empty often enough that the
  // filter dropped real photos too.
  const files = [...fileList];
  if (!files.length) return;
  // Every read is started before any of them is awaited, so the decodes run side by side on
  // the browser's image threads instead of one after another — 12 phone photos took 2787ms
  // read one at a time and 857ms this way, measured in Chrome. They are then awaited in file
  // order, which is what keeps the cards in the order they were picked.
  // The catch belongs here rather than around the await below: a rejection left sitting until
  // its turn comes round is reported as an unhandled rejection before anything can take it.
  const reads = files.map((f) => Promise.all([decode(f), captureTime(f)]).catch(() => null));
  const skipped = [];
  pending += files.length;
  refresh(true); // say how many are coming before the first one has anything to show
  for (const [i, read] of reads.entries()) {
    const got = await read;
    pending--;
    if (!got) { skipped.push(files[i].name); refresh(true); continue; } // no decoder for this format
    const [img, dt] = got;
    items.push({
      id: ++seq,
      img,
      dt,
      note: '',
      zoom: 1,
      panX: 0,
      panY: 0,
      el: null,
    });
    refresh(true); // draw each photo as it lands, rather than leaving the page blank until the last
  }
  // Thumbnails come last, once every card is up. Scaling a bitmap down costs a canvas readback,
  // and doing it inside the loop would put that in front of the next photo — the card box is
  // already grey until then, which is where it was anyway while the browser decoded the original.
  for (const it of items) {
    const im = it.el.querySelector('img');
    if (!im.getAttribute('src')) im.src = thumbUrl(it.img);
  }
  $('dropNote').textContent = skippedNote(skipped);
  $('dropNote').hidden = !skipped.length;
}

/* ---------- cards ---------- */

const pad = (n) => String(n).padStart(2, '0');
const toInputValue = (d) =>
  `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;

function buildCard(item) {
  const el = document.createElement('div');
  el.className = 'card';
  el.innerHTML = `
    <img alt="">
    <div class="fields">
      <input type="datetime-local" class="dt">
      <input type="text" class="note" placeholder="장소나 한마디 (선택) — 캡션 둘째 줄">
    </div>
    <div class="ops">
      <button class="up" title="위로">↑</button>
      <button class="down" title="아래로">↓</button>
      <button class="del" title="삭제">✕</button>
    </div>`;
  const dt = el.querySelector('.dt');
  const note = el.querySelector('.note');
  dt.value = toInputValue(item.dt);
  dt.addEventListener('input', () => {
    if (dt.value) { item.dt = new Date(dt.value); refresh(); }
  });
  note.addEventListener('input', () => { item.note = note.value.trim(); refresh(); });
  el.querySelector('.up').addEventListener('click', () => move(item, -1));
  el.querySelector('.down').addEventListener('click', () => move(item, 1));
  el.querySelector('.del').addEventListener('click', () => {
    items.splice(items.indexOf(item), 1);
    item.el?.remove();
    refresh(true);
  });
  item.el = el;
  return el;
}

function move(item, delta) {
  const i = items.indexOf(item);
  const j = i + delta;
  if (j < 0 || j >= items.length) return;
  [items[i], items[j]] = [items[j], items[i]];
  refresh(true);
}

/* ---------- caption font ---------- */

// Grouped so it is obvious which faces carry Hangul: the Latin-only ones leave Korean captions
// to whatever serif the system substitutes.
for (const [label, hangul] of [['라틴 전용', false], ['한글 지원', true]]) {
  const group = document.createElement('optgroup');
  group.label = label;
  for (const f of FONTS.filter((x) => x.hangul === hangul)) {
    group.appendChild(Object.assign(document.createElement('option'), {
      value: f.family,
      textContent: f.label,
    }));
  }
  $('font').appendChild(group);
}

const currentFont = () => FONTS.find((f) => f.family === $('font').value) ?? FONTS[0];
const currentCols = () => Number($('cols').value);

// Linked on pick rather than upfront — the four Hangul families are 58-98KB of CSS each,
// which is more than the rest of this app put together.
function stylesheet(font) {
  if (!font.css) return Promise.resolve();
  let link = document.querySelector(`link[href="${font.css}"]`);
  if (!link) {
    link = Object.assign(document.createElement('link'), { rel: 'stylesheet', href: font.css });
    link.ready = new Promise((done) => { link.onload = link.onerror = done; });
    document.head.appendChild(link);
  }
  return link.ready;
}

// Canvas has no per-glyph fallback the way CSS does, so the face must be in before fillText.
// fonts.load only fetches the unicode-range subsets covering the text handed to it, and Google
// splits Hangul across ~100 of them — omit the text and Korean glyphs never arrive.
async function loadFont(text) {
  const font = currentFont();
  await stylesheet(font);
  await document.fonts.load(`16px "${font.family}"`, text || 'A').catch(() => {});
  return font;
}

// fonts.check() is no use as the gate: it reports whether anything matching is still loading,
// so it answers true even for a family whose stylesheet has not been injected yet — checked in
// Chrome, where it is true for a made-up family name. Track what was already requested instead.
// That also bounds the redraw when a face simply has no glyph for the text (Tinos and Hangul),
// which fonts.load() resolves for without ever making it renderable.
let asked = '';
function ensureFont(text) {
  const key = `${$('font').value}\n${text}`;
  if (asked === key) return;
  asked = key;
  loadFont(text).then(() => drawPages());
}

/* ---------- rendering ---------- */

const toRenderItem = (it) => ({
  img: it.img,
  stamp: formatStamp(it.dt, $('locale').value),
  note: it.note,
  zoom: it.zoom,
  panX: it.panX,
  panY: it.panY,
});

// Only re-place the card DOM when relayout=true — typing must not lose focus.
function refresh(relayout = false) {
  if (relayout) {
    const list = $('list');
    for (const it of items) list.appendChild(it.el ?? buildCard(it));
    $('count').textContent = pending
      ? `${items.length}/${items.length + pending}장 읽는 중…`
      : `${items.length}장`;
    $('listEmpty').hidden = items.length > 0 || pending > 0;
  }
  drawPages();
}

const captionText = (page) => page.map((p) => `${p.stamp}${p.note}`).join('');

// { canvas, W, cols, pageIndex } per rendered preview canvas — rebuilt on every drawPages().
// Kept around so a drag/pinch/wheel gesture can repaint just the affected canvas (paintOnly)
// instead of tearing down and rebuilding the whole page list on every pointermove.
let pageMeta = [];

function drawPages() {
  const rendered = items.map(toRenderItem);
  const cols = currentCols();
  const pages = paginate(rendered, perPage(cols));
  const { stack } = currentFont();
  const host = $('pages');
  host.textContent = '';
  shareRows = [];
  const canvases = pages.map((page, i) => {
    const box = document.createElement('div');
    box.className = 'page';
    const canvas = document.createElement('canvas');
    box.appendChild(canvas);

    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `<span>${i + 1}번째 장 · ${page.length}컷</span>`;

    const share = document.createElement('div');
    share.className = 'share';
    const btns = SERVICES.map((s) => {
      const b = document.createElement('button');
      b.className = 'icon-btn';
      b.type = 'button';
      b.disabled = !shareBlobs[i]; // until the share copy of this page is ready
      b.innerHTML = ICONS[s.id];
      b.title = `${s.label}에 올리기`;
      b.setAttribute('aria-label', `${i + 1}번째 장을 ${s.label}에 올리기`);
      b.addEventListener('click', () => shareTo(s.id, i));
      share.appendChild(b);
      return b;
    });
    row.appendChild(share);

    const btn = document.createElement('button');
    btn.textContent = '이 장 내려받기';
    btn.addEventListener('click', () => download(page, i));
    row.appendChild(btn);
    box.appendChild(row);

    const status = document.createElement('p');
    status.className = 'status';
    status.setAttribute('aria-live', 'polite');
    box.appendChild(status);
    shareRows.push({ btns, status });

    host.appendChild(box);
    return canvas;
  });
  // Sized only once they are in the document: `width: 100%` gives a canvas its layout width from
  // the container, which is why this reads right before any bitmap exists and why setting the
  // bitmap below cannot feed back into it. Every page is the same width, so measure one.
  pageMeta = [];
  if (canvases.length) {
    const W = previewWidth(canvases[0].getBoundingClientRect().width, devicePixelRatio);
    canvases.forEach((canvas, i) => {
      renderPage(canvas, pages[i], W, stack, cols);
      const meta = { canvas, W, cols, pageIndex: i };
      pageMeta.push(meta);
      attachInteraction(canvas, meta);
    });
  }
  $('pagesEmpty').hidden = pages.length > 0;
  $('shareHint').hidden = pages.length === 0;
  $('dlAll').disabled = pages.length === 0;
  scheduleShareBlobs(pages, cols);
  // The pass above may have drawn in the fallback face; redraw once the real one lands.
  ensureFont(captionText(rendered));
}

// Repaints existing canvases in place with current item.zoom/panX/panY, without touching the DOM
// — used while a drag/pinch/wheel gesture is in progress so per-page download button closures
// (which capture a `page` array) aren't invalidated mid-gesture.
function paintOnly() {
  const { stack } = currentFont();
  for (const m of pageMeta) {
    const per = perPage(m.cols);
    const page = items.slice(m.pageIndex * per, m.pageIndex * per + per).map(toRenderItem);
    renderPage(m.canvas, page, m.W, stack, m.cols);
  }
}

let commitTimer;
// Rebuilds the page DOM (and its download-button closures) shortly after a gesture settles.
function scheduleCommit() {
  clearTimeout(commitTimer);
  commitTimer = setTimeout(drawPages, 400);
}

const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

function hitTest(x, y, W, cols) {
  const { rows } = layoutFor(cols);
  const limit = cols * rows;
  for (let i = 0; i < limit; i++) {
    const r = cellRect(i, W, cols);
    if (x >= r.x && x < r.x + r.w && y >= r.y && y < r.y + r.h) return i;
  }
  return -1;
}

// Drag to pan, wheel or pinch to zoom, within whichever cell the gesture started in. Panning and
// pinching share one pointermove listener via the Pointer Events API (mouse, touch and pen all
// report through it), keyed on how many pointers are currently down on this canvas.
function attachInteraction(canvas, meta) {
  const pointers = new Map(); // pointerId -> last {x, y} in canvas-pixel space
  let itemIdx = null; // index into the global `items` array
  let localIdx = null; // cell index within this page
  let start = null;

  const point = (e) => {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (e.clientX - rect.left) * (canvas.width / rect.width),
      y: (e.clientY - rect.top) * (canvas.height / rect.height),
    };
  };

  // How far (in canvas px) the image can shift off-center at its current zoom before a gap
  // would show in the cell — the same quantity drawCover() reads panX/panY as a fraction of.
  const slackFor = (item, w, h) => {
    const s = Math.max(w / item.img.width, h / item.img.height) * item.zoom;
    return {
      sx: Math.max(0, (item.img.width * s - w) / 2),
      sy: Math.max(0, (item.img.height * s - h) / 2),
    };
  };

  function beginGesture() {
    if (pointers.size === 1) {
      const [p] = pointers.values();
      const idx = hitTest(p.x, p.y, meta.W, meta.cols);
      const per = perPage(meta.cols);
      const item = idx >= 0 ? items[meta.pageIndex * per + idx] : null;
      if (!item) { itemIdx = null; start = null; return; }
      itemIdx = meta.pageIndex * per + idx;
      localIdx = idx;
      start = { mode: 'pan', panX: item.panX, panY: item.panY, x: p.x, y: p.y };
    } else if (pointers.size === 2 && itemIdx != null) {
      const [a, b] = [...pointers.values()];
      start = { mode: 'pinch', zoom: items[itemIdx].zoom, dist: Math.hypot(a.x - b.x, a.y - b.y) };
    }
  }

  canvas.addEventListener('pointerdown', (e) => {
    try { canvas.setPointerCapture(e.pointerId); } catch { /* capture is best-effort */ }
    pointers.set(e.pointerId, point(e));
    beginGesture();
    e.preventDefault();
  });

  canvas.addEventListener('pointermove', (e) => {
    if (!pointers.has(e.pointerId) || itemIdx == null || !start) return;
    const p = point(e);
    pointers.set(e.pointerId, p);
    const item = items[itemIdx];
    if (start.mode === 'pan' && pointers.size === 1) {
      const r = cellRect(localIdx, meta.W, meta.cols);
      const { sx, sy } = slackFor(item, r.w, r.h);
      item.panX = sx > 0 ? clamp(start.panX + (p.x - start.x) / sx, -1, 1) : 0;
      item.panY = sy > 0 ? clamp(start.panY + (p.y - start.y) / sy, -1, 1) : 0;
      paintOnly();
    } else if (start.mode === 'pinch' && pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      const dist = Math.hypot(a.x - b.x, a.y - b.y);
      if (start.dist > 0) item.zoom = clamp(start.zoom * (dist / start.dist), 1, 4);
      paintOnly();
    }
    e.preventDefault();
  });

  const end = (e) => {
    pointers.delete(e.pointerId);
    if (pointers.size === 0) {
      const changed = itemIdx != null;
      itemIdx = null;
      start = null;
      if (changed) drawPages(); // refresh download-button closures with the final crop
    } else {
      beginGesture(); // re-baseline, e.g. pinch -> pan when one finger lifts
    }
  };
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointercancel', end);

  canvas.addEventListener('wheel', (e) => {
    const p = point(e);
    const idx = hitTest(p.x, p.y, meta.W, meta.cols);
    if (idx < 0) return;
    e.preventDefault();
    const per = perPage(meta.cols);
    const item = items[meta.pageIndex * per + idx];
    if (!item) return;
    item.zoom = clamp(item.zoom * Math.exp(-e.deltaY * 0.0015), 1, 4);
    paintOnly();
    scheduleCommit();
  }, { passive: false });
}

const pageName = (i) => `timeline-${String(i + 1).padStart(2, '0')}.png`;

function saveBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  a.click();
  URL.revokeObjectURL(url);
}

// page -> PNG blob at `W`, in the picked face rather than whatever stood in for it.
async function pageBlob(page, W, cols) {
  const { stack } = await loadFont(captionText(page));
  const canvas = document.createElement('canvas');
  renderPage(canvas, page, W, stack, cols);
  return new Promise((r) => canvas.toBlob(r, 'image/png'));
}

async function download(page, i) {
  saveBlob(await pageBlob(page, EXPORT_W, currentCols()), pageName(i));
}

/* ---------- sharing ---------- */

// Both answers depend on the browser and the MIME type, never on the particular image, so they
// are settled once at load. canShare() has to be asked with a real File; a one-byte stand-in
// gets the same answer as the page would, and asking now is what lets the UI say in advance
// what a button press will do instead of finding out during it.
const CAN_COPY_IMAGE = typeof ClipboardItem === 'function' && !!navigator.clipboard?.write;
const CAN_SHARE_FILES = (() => {
  try {
    return !!navigator.canShare?.({ files: [new File([new Uint8Array(1)], 'a.png', { type: 'image/png' })] });
  } catch {
    return false;
  }
})();
const PASTE = navigator.userAgent.includes('Mac') ? '⌘V' : 'Ctrl+V';

// Brand marks from Simple Icons (CC0), pasted in rather than pulled from a package: this app has
// no build and no dependencies, and shadcn's own icon set (lucide) carries no brand logos, so its
// blocks inline them the same way. 24-unit viewBox filled with currentColor, sized by CSS.
const ICONS = {
  instagram: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.0301.084c-1.2768.0602-2.1487.264-2.911.5634-.7888.3075-1.4575.72-2.1228 1.3877-.6652.6677-1.075 1.3368-1.3802 2.127-.2954.7638-.4956 1.6365-.552 2.914-.0564 1.2775-.0689 1.6882-.0626 4.947.0062 3.2586.0206 3.6671.0825 4.9473.061 1.2765.264 2.1482.5635 2.9107.308.7889.72 1.4573 1.388 2.1228.6679.6655 1.3365 1.0743 2.1285 1.38.7632.295 1.6361.4961 2.9134.552 1.2773.056 1.6884.069 4.9462.0627 3.2578-.0062 3.668-.0207 4.9478-.0814 1.28-.0607 2.147-.2652 2.9098-.5633.7889-.3086 1.4578-.72 2.1228-1.3881.665-.6682 1.0745-1.3378 1.3795-2.1284.2957-.7632.4966-1.636.552-2.9124.056-1.2809.0692-1.6898.063-4.948-.0063-3.2583-.021-3.6668-.0817-4.9465-.0607-1.2797-.264-2.1487-.5633-2.9117-.3084-.7889-.72-1.4568-1.3876-2.1228C21.2982 1.33 20.628.9208 19.8378.6165 19.074.321 18.2017.1197 16.9244.0645 15.6471.0093 15.236-.005 11.977.0014 8.718.0076 8.31.0215 7.0301.0839m.1402 21.6932c-1.17-.0509-1.8053-.2453-2.2287-.408-.5606-.216-.96-.4771-1.3819-.895-.422-.4178-.6811-.8186-.9-1.378-.1644-.4234-.3624-1.058-.4171-2.228-.0595-1.2645-.072-1.6442-.079-4.848-.007-3.2037.0053-3.583.0607-4.848.05-1.169.2456-1.805.408-2.2282.216-.5613.4762-.96.895-1.3816.4188-.4217.8184-.6814 1.3783-.9003.423-.1651 1.0575-.3614 2.227-.4171 1.2655-.06 1.6447-.072 4.848-.079 3.2033-.007 3.5835.005 4.8495.0608 1.169.0508 1.8053.2445 2.228.408.5608.216.96.4754 1.3816.895.4217.4194.6816.8176.9005 1.3787.1653.4217.3617 1.056.4169 2.2263.0602 1.2655.0739 1.645.0796 4.848.0058 3.203-.0055 3.5834-.061 4.848-.051 1.17-.245 1.8055-.408 2.2294-.216.5604-.4763.96-.8954 1.3814-.419.4215-.8181.6811-1.3783.9-.4224.1649-1.0577.3617-2.2262.4174-1.2656.0595-1.6448.072-4.8493.079-3.2045.007-3.5825-.006-4.848-.0608M16.953 5.5864A1.44 1.44 0 1 0 18.39 4.144a1.44 1.44 0 0 0-1.437 1.4424M5.8385 12.012c.0067 3.4032 2.7706 6.1557 6.173 6.1493 3.4026-.0065 6.157-2.7701 6.1506-6.1733-.0065-3.4032-2.771-6.1565-6.174-6.1498-3.403.0067-6.156 2.771-6.1496 6.1738M8 12.00   threads: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.263 11.097c-.03-3.486-1.92-5.586-5.111-5.586-2.13 0-3.922.963-4.863 2.499l2.062 1.438c.535-.843 1.272-1.543 2.628-1.543 1.528 0 2.318.85 2.544 2.431a15 15 0 0 0-2.236-.173c-4.125 0-6.068 1.867-6.068 4.336s1.943 3.99 4.804 3.99c3.139 0 5.013-2.115 5.781-4.735.798.361 1.348 1.204 1.348 2.47 0 3.387-3.907 5.232-7.22 5.232-4.885 0-8.077-3.207-8.077-8.424 0-6.392 4.223-10.487 9.9-10.487 3.808 0 5.69 1.671 6.97 3.914l2.108-1.475C21.44 2.078 18.331 0 13.663 0 6.227 0 1.168 5.277 1.168 12.934c0 7 4.953 11.066 10.856 11.066 4.878 0 9.809-2.846 9.809-7.716 0-2.545-1.46-4.231-3.569-5.187m-6.33 4.855c-1.077 0-2.026-.512-2.026-1.453 0-1.483 1.822-1.934 3.606-1.934.678 0 1.34.045 1.927.173-.422 1.927-1.671 3.215-3.508 3.214Z"/></svg>`,
  x: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.234 10.162 22.977 0h-2.072l-7.591 8.824L7.251 0H.258l9.168 13.343L.258 24H2.33l8.016-9.318L16.749 24h6.993zm-2.837 3.299-.929-1.329L3.076 1.56h3.182l5.965 8.532.929 1.329 7.754 11.09h-3.182z"/></svg>`,
};

$('shareHint').textContent = CAN_SHARE_FILES
  ? 'SNS 버튼을 누르면 공유 시트가 열립니다 — 거기서 앱을 고르면 그대로 올라갑니다.'
  : CAN_COPY_IMAGE
    ? `SNS 버튼을 누르면 이미지를 복사하고 작성창을 엽니다 — ${PASTE}로 붙여넣으세요. (Instagram은 붙여넣기를 받지 않아 파일로 내려갑니다.)`
    : 'SNS 버튼을 누르면 이미지를 내려받고 작성창을 엽니다 — 작성창에서 그 파일을 고르세요.';

// One blob per page, prepared on a debounce after edits settle and thrown away when they change.
// Preparing it up front is the whole point: navigator.share() needs the click's transient
// activation and cannot be handed a promise, so anything awaited inside the handler loses it on
// WebKit. Nothing below the click is async — see SHARE_W in timeline.js for what that costs.
let shareBlobs = [];
let shareRows = []; // per page: the buttons to enable and the line to report into
let shareTimer;
let shareToken = 0;

function scheduleShareBlobs(pages, cols) {
  clearTimeout(shareTimer);
  const token = ++shareToken;
  shareBlobs = [];
  showShareReady();
  if (!pages.length) return;
  shareTimer = setTimeout(async () => {
    const made = [];
    for (const page of pages) {
      made.push(await pageBlob(page, SHARE_W, cols));
      if (token !== shareToken) return; // an edit landed mid-batch; a newer one is on its way
    }
    shareBlobs = made;
    showShareReady();
  }, 400); // the settle time the gesture commit already uses
}

const showShareReady = () =>
  shareRows.forEach((row, i) => row.btns.forEach((b) => { b.disabled = !shareBlobs[i]; }));

const say = (i, text) => { if (shareRows[i]) shareRows[i].status.textContent = text; };

function shareTo(service, i) {
  const blob = shareBlobs[i];
  if (!blob) return;
  const { label } = SERVICES.find((s) => s.id === service);
  const plan = sharePlan({ service, canShareFiles: CAN_SHARE_FILES, canCopyImage: CAN_COPY_IMAGE });

  if (plan === 'share') {
    navigator.share({ files: [new File([blob], pageName(i), { type: 'image/png' })] })
      .then(() => say(i, `${label}에 보냈습니다.`))
      .catch(() => {}); // the sheet was dismissed, which is not an error worth reporting
    return;
  }
  if (plan === 'clipboard') {
    // ClipboardItem is the one of the three that takes a promise, but the blob is already here.
    navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })])
      .catch(() => { saveBlob(blob, pageName(i)); say(i, `복사가 막혀 ${pageName(i)}으로 내려받았습니다.`); });
    say(i, `이미지를 복사했습니다 — ${label} 작성창에서 ${PASTE}로 붙여넣으세요.`);
  } else {
    saveBlob(blob, pageName(i));
    say(i, `${pageName(i)}을 내려받았습니다 — ${label} 작성창에서 이 파일을 고르세요.`);
  }
  const per = perPage(currentCols());
  open(intentUrl(service, shareText(items.slice(i * per, i * per + per))), '_blank', 'noopener');
}

/* ---------- events ---------- */

$('drop').addEventListener('click', () => $('file').click());
$('file').addEventListener('change', (e) => { addFiles(e.target.files); e.target.value = ''; });
for (const type of ['dragenter', 'dragover']) {
  $('drop').addEventListener(type, (e) => { e.preventDefault(); $('drop').classList.add('over'); });
}
for (const type of ['dragleave', 'drop']) {
  $('drop').addEventListener(type, () => $('drop').classList.remove('over'));
}
$('drop').addEventListener('drop', (e) => { e.preventDefault(); addFiles(e.dataTransfer.files); });

$('cols').addEventListener('change', () => refresh());
$('font').addEventListener('change', () => refresh());
$('locale').addEventListener('change', () => refresh());
$('sort').addEventListener('click', () => { items.sort((a, b) => a.dt - b.dt); refresh(true); });
$('clear').addEventListener('click', () => {
  items.length = 0;
  $('list').textContent = '';
  refresh(true);
});
$('dlAll').addEventListener('click', async () => {
  const cols = currentCols();
  const pages = paginate(items.map(toRenderItem), perPage(cols));
  for (let i = 0; i < pages.length; i++) await download(pages[i], i);
});

// The bitmap tracks the CSS width now, so a resize invalidates it. Dragging the window onto a
// screen with a different devicePixelRatio fires resize as well, which is what keeps it sharp
// there. Trailing-edge only — a redraw per frame of a drag would be pure waste.
let resizeTimer;
addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(drawPages, 150);
});

refresh(true); // drawPages starts the font load and redraws itself once it lands
</script>
